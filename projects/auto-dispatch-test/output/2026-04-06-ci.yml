# .github/workflows/ci.yml
# GitHub Actions CI pipeline for auto-dispatch-test joke API
# dag — 2026-04-06
#
# Runs on every push to main and on all pull requests.
# Steps: lint (ruff) → test (pytest) → docker build
# Docker push is intentionally omitted until a registry is chosen.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app/

      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: auto-dispatch-test-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
