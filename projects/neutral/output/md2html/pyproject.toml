[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2html"
version = "0.1.0"
description = "Convert Markdown files to self-contained, styled HTML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mistune>=3.0",
    "jinja2>=3.0",
    "click>=8.0",
]

[project.optional-dependencies]
watch = ["watchdog>=4.0"]

[project.scripts]
md2html = "md2html.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["md2html"]
