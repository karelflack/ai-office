[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackr-backend"
version = "0.1.0"
description = "Stackr — track your tech stack, dependencies, and CVEs"
requires-python = ">=3.11"

dependencies = [
    # FastAPI core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",          # Async PostgreSQL driver
    "alembic>=1.13.0",

    # Auth — JWT verification (Supabase uses HS256)
    "pyjwt>=2.9.0",

    # HTTP client — OSV.dev queries
    "httpx>=0.27.0",

    # Encryption — API key envelope encryption (magnus C1)
    "cryptography>=43.0.0",

    # Background jobs
    "arq>=0.26.0",

    # Supabase client (for Auth upsert if needed)
    "supabase>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",             # async test client
    "aiosqlite>=0.20.0",         # in-memory SQLite for tests
    "anyio>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*", "alembic/*"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
