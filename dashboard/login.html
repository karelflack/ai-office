<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pathless</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --tp:        #0a0e1a;
      --ts:        #5b6479;
      --tt:        #9ca3af;
      --cyan:      #22d3ee;
      --blue:      #007aff;
      --red:       #ff3b30;
      --hairline:  rgba(0,0,0,0.08);
      --hairline-strong: rgba(0,0,0,0.14);
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font);
      min-height: 100vh;
      color: var(--tp);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 18% 12%, rgba(34,211,238,0.18), transparent 42%),
        radial-gradient(circle at 82% 88%, rgba(0,122,255,0.15), transparent 50%),
        linear-gradient(180deg, #f8fbff 0%, #eef2f8 100%);
      background-attachment: fixed;
      padding: 2rem;
    }

    #login-card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 20px;
      padding: 2.25rem 2rem 1.75rem;
      width: 360px;
      box-shadow:
        0 1px 2px rgba(0,0,0,0.04),
        0 12px 36px rgba(15,23,42,0.10),
        inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .card-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .logo-glow {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan), 0 0 24px rgba(34,211,238,0.5);
      animation: glowPulse 2.5s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 8px var(--cyan), 0 0 24px rgba(34,211,238,0.45); }
      50%      { box-shadow: 0 0 12px var(--cyan), 0 0 36px rgba(34,211,238,0.65); }
    }
    .logo-img {
      height: 30px;
      width: auto;
      display: block;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 13px;
      color: var(--ts);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 0.875rem;
    }
    .field label {
      font-size: 11px;
      font-weight: 600;
      color: var(--ts);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .field input {
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--hairline-strong);
      border-radius: 10px;
      color: var(--tp);
      font-family: inherit;
      font-size: 14px;
      padding: 11px 14px;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .field input:focus {
      outline: none;
      border-color: var(--blue);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0,122,255,0.18);
    }
    .field input::placeholder { color: var(--tt); }

    #error-msg {
      display: none;
      font-size: 12px;
      color: var(--red);
      margin-bottom: 0.75rem;
      padding: 8px 12px;
      background: rgba(255,59,48,0.08);
      border: 1px solid rgba(255,59,48,0.22);
      border-radius: 8px;
    }
    #error-msg.visible { display: block; }

    #login-btn {
      background: var(--blue);
      border: none;
      border-radius: 11px;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 14px;
      cursor: pointer;
      width: 100%;
      margin-top: 0.5rem;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 1px 2px rgba(0,122,255,0.2), 0 8px 24px rgba(0,122,255,0.22);
    }
    #login-btn:hover { background: #0066d6; box-shadow: 0 1px 2px rgba(0,122,255,0.25), 0 10px 28px rgba(0,122,255,0.30); }
    #login-btn:active { transform: scale(0.985); }
  </style>
</head>
<body>
  <div id="login-card">
    <div class="card-logo">
      <span class="logo-glow"></span>
      <img class="logo-img" src="/dashboard/logo.png?v=2" alt="Pathless AI" onerror="this.style.display='none'" />
    </div>
    <h1>Welcome back</h1>
    <p class="card-sub">Sign in to access the agent workspace.</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="Username" spellcheck="false" autofocus />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password" />
      </div>
      <p id="error-msg">Incorrect username or password.</p>
      <button id="login-btn" type="submit">Sign In</button>
    </form>
  </div>
  <script>
    var form     = document.getElementById('login-form');
    var errorMsg = document.getElementById('error-msg');
    var card     = document.getElementById('login-card');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.ok) {
          sessionStorage.setItem('authenticated', 'true');
          window.location.replace('/dashboard/menu.html?cb=' + Date.now());
        } else {
          errorMsg.classList.add('visible');
          card.style.transition = 'transform 0.07s ease';
          card.style.transform  = 'translateX(7px)';
          setTimeout(function() { card.style.transform = 'translateX(-7px)'; }, 70);
          setTimeout(function() { card.style.transform = 'translateX(4px)'; },  140);
          setTimeout(function() { card.style.transform = 'translateX(0)'; },    210);
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      }).catch(function() { errorMsg.classList.add('visible'); });
    });

    ['username', 'password'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', function() {
        errorMsg.classList.remove('visible');
      });
    });
  </script>
</body>
</html>
