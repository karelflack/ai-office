<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pathless AI Office — System Diagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 40px 20px; }
  svg { max-width: 100%; }
</style>
</head>
<body>

  <defs>

      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#0f1117" rx="12"/>

  <!-- Title -->

  <text x="450" y="70" text-anchor="middle" fill="#6b7280" font-size="11" letter-spacing="1">TRIGGERS</text>

  <!-- Arrow down -->
  <line x1="450" y1="244" x2="450" y2="272" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="715" y1="324" x2="570" y2="368" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="310" y="391" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">JORUNN</text>

  <text x="400" y="391" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">ELSE</text>

  <!-- Arrows phase 2 → phase 3 -->

  <line x1="520" y1="418" x2="565" y2="448" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="565" y1="494" x2="510" y2="528" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Pass arrow -->
  <line x1="450" y1="582" x2="450" y2="608" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="462" y="600" fill="#10b981" font-size="9">pass</text>

  <!-- Fail arrow (loop back) -->
  <path d="M 330 557 Q 180 557 180 490 Q 180 420 240 420 Q 300 420 310 448" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <text x="140" y="510" fill="#ef4444" font-size="9">fail → arve fixes</text>

  <text x="310" y="652" text-anchor="middle" fill="#6b7280" font-size="10">Project summary page</text>

  <!-- Linear -->
  <rect x="420" y="614" width="140" height="52" rx="8" fill="#1a1f2e" stroke="#6b7280" stroke-width="1.5"/>

  <text x="490" y="652" text-anchor="middle" fill="#6b7280" font-size="10">Issues updated + PR link</text>

  <!-- Slack -->

  <text x="670" y="652" text-anchor="middle" fill="#6b7280" font-size="10">Agent notifications</text>

  <!-- Arrows to outputs -->

  <line x1="420" y1="608" x2="340" y2="614" stroke="#10b981" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <line x1="480" y1="608" x2="490" y2="614" stroke="#10b981" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <line x1="510" y1="608" x2="620" y2="614" stroke="#10b981" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <text x="815" y="392" text-anchor="middle" fill="#6b7280" font-size="10" font-weight="600">SHARED</text>
  <text x="815" y="406" text-anchor="middle" fill="#6b7280" font-size="10" font-weight="600">MEMORY</text>
  <text x="815" y="424" text-anchor="middle" fill="#4b5563" font-size="9">architecture</text>
  <text x="815" y="438" text-anchor="middle" fill="#4b5563" font-size="9">implementation</text>
  <text x="815" y="452" text-anchor="middle" fill="#4b5563" font-size="9">strategy</text>
  <text x="815" y="466" text-anchor="middle" fill="#4b5563" font-size="9">compliance</text>

</svg>
